name: Native client checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Verify cross-platform repository contracts
        run: python3 Scripts/check-repository.py
      - name: Check Mac behavior remains compatible
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-news-previews
          path: build/mac-news-*.png
      - name: Package Mac app
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: Babelstaarnet-macOS
          path: dist/*-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows behavior and worker protocol
        shell: pwsh
        run: ./Scripts/test-windows.ps1
      - name: Render light and dark Windows surfaces
        shell: pwsh
        run: dotnet run --project Tests/WindowsChecks/WindowsChecks.csproj -c Release --no-build --no-restore -- --render-ui build/windows-ci.png
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-previews
          path: build/windows-ci*.png
      - name: Package Windows app
        shell: pwsh
        run: ./Scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Babelstaarnet-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64.zip.sha256
